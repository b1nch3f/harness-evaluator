[project]
name = "skills-builder"
version = "0.1.0"
description = "Measure how agent skills improve gpt-oss-120b on tau2-bench retail"
readme = "README.md"
authors = [
    { name = "Sangram Kesari Ray", email = "shankar.ray030@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "google-adk==2.12.0",
    "litellm==1.82.6",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "tau2[gym]",
    "typer==0.27.3",
    "wandb==0.28.1",
]

[project.scripts]
sb = "skills_builder.cli:app"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
tau2 = { git = "https://github.com/sierra-research/tau2-bench", rev = "96a3ef92329baf908ffe9dfe188cea34e8701d2a" }

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
